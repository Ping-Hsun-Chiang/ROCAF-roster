name: Verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Regression test
        run: npm run test:scheduler

      - name: Scenario simulation (thresholds)
        run: npm run simulate -- --check

      - name: Build
        run: npm run build

  # 重現實驗：從程式碼重新產生原始數據，必須與 repo 中的 CSV 完全相同；再執行 notebook 以 scipy 交叉驗證
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Regenerate raw data
        run: npm run export-data

      - name: Raw data must match the committed CSV
        run: git diff --stat --exit-code -- docs/experiments/data

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/experiments/requirements.txt

      - run: pip install -r docs/experiments/requirements.txt

      - name: Execute analysis notebook (cross-validates stats.ts with scipy)
        run: jupyter nbconvert --to notebook --execute docs/experiments/analysis.ipynb --output-dir "$RUNNER_TEMP"
